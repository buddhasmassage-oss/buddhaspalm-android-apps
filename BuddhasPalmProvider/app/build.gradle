plugins {
    id 'com.android.application'
}

android {
    namespace 'com.buddhaspalm.provider'
    compileSdk 35

    defaultConfig {
        applicationId 'com.buddhaspalm.provider'
        minSdk 26
        targetSdk 35
        versionCode 12
        versionName '1.4.4'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'com.onesignal:OneSignal:5.9.2'
}
