name: Build BuddhaStudy Tutor iOS

on:
  workflow_dispatch:
  push:
    paths:
      - 'BuddhaStudyTutorIOS/**'
      - '.github/workflows/build-ios.yml'

jobs:
  simulator-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate app icons
        working-directory: BuddhaStudyTutorIOS
        run: bash generate-icons.sh
      - name: Generate Xcode project
        working-directory: BuddhaStudyTutorIOS
        run: xcodegen generate
      - name: Resolve Firebase packages
        working-directory: BuddhaStudyTutorIOS
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project BuddhaStudyTutorIOS.xcodeproj \
            -scheme BuddhaStudyTutorIOS
      - name: Build iPhone Simulator app
        working-directory: BuddhaStudyTutorIOS
        run: |
          xcodebuild \
            -project BuddhaStudyTutorIOS.xcodeproj \
            -scheme BuddhaStudyTutorIOS \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package simulator app
        working-directory: BuddhaStudyTutorIOS
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/Build/Products/Debug-iphonesimulator/BuddhaStudyTutor.app \
            BuddhaStudyTutor-iPhone-Simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: BuddhaStudy-Tutor-iOS-Simulator
          path: BuddhaStudyTutorIOS/BuddhaStudyTutor-iPhone-Simulator.zip
          retention-days: 30
