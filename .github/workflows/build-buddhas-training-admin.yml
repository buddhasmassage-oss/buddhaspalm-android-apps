name: Build Buddhas Training Admin APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'BuddhasTrainingAdmin/**'
      - '.github/workflows/build-buddhas-training-admin.yml'

permissions:
  contents: read

jobs:
  build-buddhas-training-admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BuddhasTrainingAdmin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK 35
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Verify exact Buddhas Training crest icon
        run: |
          test -f app/src/main/res/drawable/buddhas_training_logo.png
          file app/src/main/res/drawable/buddhas_training_logo.png
      - name: Apply fingerprint login fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/net/buddhasprovider/admin/MainActivity.java')
          s=p.read_text()
          s=s.replace('import android.app.BiometricPrompt;','import android.hardware.biometrics.BiometricPrompt;')
          s=s.replace('private String fcmToken = "";','private String fcmToken = "";\n    private boolean biometricAutoPrompted = false;')
          s=s.replace('''            @Override public void onPageFinished(WebView view, String url) {\n                super.onPageFinished(view, url);\n                CookieManager.getInstance().flush();\n                registerCurrentToken();\n                updateBiometricButton(url);\n            }''','''            @Override public void onPageFinished(WebView view, String url) {\n                super.onPageFinished(view, url);\n                CookieManager.getInstance().flush();\n                registerCurrentToken();\n                updateBiometricButton(url);\n                if (isAdminLoginPage(url) && isBiometricRegistered() && !biometricAutoPrompted) {\n                    biometricAutoPrompted = true;\n                    webView.postDelayed(() -> authenticateAndLogin(), 450);\n                }\n            }''')
          s=s.replace('''        if (isBiometricRegistered() && isAdminLoginPage(url)) {\n            authenticateAndLogin();\n        } else if (!isBiometricRegistered() && isLoggedInAdminPage(url)) {\n            registerFingerprint();''','''        if (isBiometricRegistered() && isAdminLoginPage(url)) {\n            authenticateAndLogin();\n        } else if (!isBiometricRegistered() && isAdminLoginPage(url)) {\n            new AlertDialog.Builder(this)\n                    .setTitle("Set up fingerprint login")\n                    .setMessage("For security, first sign in once with your normal Admin username and password. After the dashboard opens, tap Register Fingerprint. Future logins will open the Android fingerprint prompt automatically.")\n                    .setPositiveButton("Sign In First", null)\n                    .setNegativeButton("Cancel", null)\n                    .show();\n        } else if (!isBiometricRegistered() && isLoggedInAdminPage(url)) {\n            registerFingerprint();''')
          s=s.replace('''        if (isAdminLoginPage(url) && isBiometricRegistered()) {\n            biometricButton.setText("Fingerprint Login");\n            biometricButton.setVisibility(View.VISIBLE);\n            return;\n        }''','''        if (isAdminLoginPage(url) && isBiometricRegistered()) {\n            biometricButton.setText("Fingerprint Login");\n            biometricButton.setVisibility(View.VISIBLE);\n            return;\n        }\n        if (isAdminLoginPage(url) && !isBiometricRegistered()) {\n            biometricButton.setText("Set Up Fingerprint");\n            biometricButton.setVisibility(View.VISIBLE);\n            return;\n        }''')
          s=s.replace('if (errorCode != BiometricPrompt.BIOMETRIC_ERROR_NEGATIVE_BUTTON) {','if (true) {')
          s=s.replace('BuddhasTrainingAdmin-Android/1.0.4 NativeFingerprint','BuddhasTrainingAdmin-Android/1.0.6 NativeFingerprint')
          s=s.replace('BuddhasTrainingAdmin-Android/1.0.5 NativeFingerprint','BuddhasTrainingAdmin-Android/1.0.6 NativeFingerprint')
          s=s.replace('BiometricManager.Authenticators.BIOMETRIC_STRONG | BiometricManager.Authenticators.BIOMETRIC_WEAK','android.hardware.biometrics.BiometricManager.Authenticators.BIOMETRIC_STRONG | android.hardware.biometrics.BiometricManager.Authenticators.BIOMETRIC_WEAK')
          p.write_text(s)

          g=Path('app/build.gradle')
          t=g.read_text().replace('versionCode 4','versionCode 6').replace('versionCode 5','versionCode 6').replace("versionName '1.0.4'","versionName '1.0.6'").replace("versionName '1.0.5'","versionName '1.0.6'")
          g.write_text(t)
          PY
      - name: Build Admin APK
        run: gradle assembleDebug --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "Buddhas Training Admin v1.0.6 Exact Crest Icon.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Buddhas-Training-Admin-v1.0.6-Exact-Crest-Icon
          path: "BuddhasTrainingAdmin/Buddhas Training Admin v1.0.6 Exact Crest Icon.apk"
