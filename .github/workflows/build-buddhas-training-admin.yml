name: Build Buddhas Training Admin APK

on:
  push:
    branches: [ buddhas-training-admin-v1 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Create isolated Admin source from student template
        run: |
          cp -a BuddhasTraining BuddhasTrainingAdminBuild
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('BuddhasTrainingAdminBuild')
          def rep(rel, pairs):
              p=root/rel
              s=p.read_text()
              for a,b in pairs:
                  s=s.replace(a,b)
              p.write_text(s)
          rep('app/build.gradle', [
              ("namespace 'net.buddhasprovider.app'", "namespace 'net.buddhasprovider.admin'"),
              ("applicationId 'net.buddhasprovider.app'", "applicationId 'net.buddhasprovider.admin'"),
              ("versionName '1.0.0'", "versionName '1.0.1'")
          ])
          rep('settings.gradle', [("rootProject.name = 'BuddhasTraining'", "rootProject.name = 'BuddhasTrainingAdmin'")])
          java_dir=root/'app/src/main/java/net/buddhasprovider/app'
          for name in ['MainActivity.java','BuddhasFirebaseMessagingService.java']:
              p=java_dir/name
              s=p.read_text().replace('package net.buddhasprovider.app;', 'package net.buddhasprovider.admin;')
              s=s.replace('BuddhasTraining-Android/1.0.0','BuddhasTrainingAdmin-Android/1.0.1')
              s=s.replace('BuddhasTraining-FCM-Register','BuddhasTrainingAdmin-FCM-Register')
              s=s.replace('buddhas_training_updates','buddhas_training_admin_updates')
              p.write_text(s)
          strings=root/'app/src/main/res/values/strings.xml'
          s=strings.read_text()
          s=s.replace('<string name="app_name">Buddhas Training</string>', '<string name="app_name">Buddhas Training Admin</string>')
          s=s.replace('<string name="start_url">https://buddhasprovider.net/</string>', '<string name="start_url">https://buddhasprovider.net/admin/</string>')
          s=s.replace('Buddhas Training Notifications','Buddhas Training Admin Notifications')
          s=s.replace('Enrollment, course, class, payment and Admin updates.','Admin alerts for registrations, enrollments, orders, chat and course activity.')
          strings.write_text(s)
          manifest=root/'app/src/main/AndroidManifest.xml'
          s=manifest.read_text().replace('buddhas_training_updates','buddhas_training_admin_updates')
          s=s.replace('android:host="buddhasprovider.net" />','android:host="buddhasprovider.net"\n                    android:pathPrefix="/admin" />')
          manifest.write_text(s)
          gs=root/'app/google-services.json'
          data=json.loads(gs.read_text())
          found=False
          for client in data.get('client',[]):
              info=client.get('client_info',{})
              android=info.get('android_client_info',{})
              if android.get('package_name')=='net.buddhasprovider.app':
                  android['package_name']='net.buddhasprovider.admin'
                  info['mobilesdk_app_id']='1:1020836481565:android:7006b7c9b77f1ad9bed4f4'
                  found=True
          if not found:
              raise SystemExit('Student Firebase client not found in template')
          gs.write_text(json.dumps(data,indent=2))
          PY
      - name: Install Android SDK 35
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build clean Admin APK with Gradle
        working-directory: BuddhasTrainingAdminBuild
        run: gradle clean assembleDebug --no-daemon
      - name: Verify APK
        run: |
          APK="BuddhasTrainingAdminBuild/app/build/outputs/apk/debug/app-debug.apk"
          /usr/local/lib/android/sdk/build-tools/35.0.0/apksigner verify --verbose --print-certs "$APK"
          /usr/local/lib/android/sdk/build-tools/35.0.0/aapt dump badging "$APK" | head -20
          cp "$APK" "Buddhas Training Admin v1.0.1.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Buddhas-Training-Admin-v1.0.1-APK
          path: "Buddhas Training Admin v1.0.1.apk"
          retention-days: 30
