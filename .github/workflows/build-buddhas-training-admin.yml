name: Build Buddhas Training Admin APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'BuddhasTrainingAdmin/**'
      - '.github/workflows/build-buddhas-training-admin.yml'

permissions:
  contents: read

jobs:
  build-buddhas-training-admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BuddhasTrainingAdmin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK 35
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Copy Buddhas Training logo
        run: |
          mkdir -p app/src/main/res/drawable
          cp ../BuddhasTraining/app/src/main/res/drawable/buddhas_training_logo.png app/src/main/res/drawable/buddhas_training_logo.png
      - name: Apply native fingerprint compile fixes
        run: |
          sed -i 's/import android\.app\.BiometricPrompt;/import android.hardware.biometrics.BiometricPrompt;/' app/src/main/java/net/buddhasprovider/admin/MainActivity.java
          sed -i 's/if (errorCode != BiometricPrompt\.BIOMETRIC_ERROR_NEGATIVE_BUTTON) {/if (true) {/' app/src/main/java/net/buddhasprovider/admin/MainActivity.java
      - name: Build Admin APK
        run: gradle assembleDebug --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "Buddhas Training Admin v1.0.4 Native Fingerprint.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Buddhas-Training-Admin-Native-Fingerprint-v1.0.4
          path: "BuddhasTrainingAdmin/Buddhas Training Admin v1.0.4 Native Fingerprint.apk"
