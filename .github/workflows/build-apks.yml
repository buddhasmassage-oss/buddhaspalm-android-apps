name: Build BuddhasPalm Android APKs

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BuddhasPalmAdmin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build Admin APK
        run: gradle assembleDebug
      - name: Rename Admin APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "Buddhas Admin.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Buddhas-Admin-APK
          path: "BuddhasPalmAdmin/Buddhas Admin.apk"

  build-provider:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BuddhasPalmProvider
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build Provider APK
        run: gradle assembleDebug
      - name: Rename Provider APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "Provider app.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Provider-app-APK
          path: "BuddhasPalmProvider/Provider app.apk"
