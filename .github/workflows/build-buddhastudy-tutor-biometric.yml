name: Build BuddhaStudy Tutor Biometric

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'BuddhaStudyTutor/**'
      - '.github/workflows/build-buddhastudy-tutor-biometric.yml'

permissions:
  contents: read

jobs:
  build-tutor-biometric:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TUTOR_KEYSTORE_PATH: /tmp/tutor-release.jks
      TUTOR_KEYSTORE_PASSWORD: ${{ secrets.TUTOR_KEYSTORE_PASSWORD }}
      TUTOR_KEY_ALIAS: ${{ secrets.TUTOR_KEY_ALIAS }}
      TUTOR_KEY_PASSWORD: ${{ secrets.TUTOR_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Prepare Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Prepare existing release key when configured
        env:
          KEYSTORE_BASE64: ${{ secrets.TUTOR_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$TUTOR_KEYSTORE_PATH"
            chmod 600 "$TUTOR_KEYSTORE_PATH"
          else
            echo "Release signing is not configured. Release output will be unsigned; do not submit it."
          fi
      - name: Build and lint Tutor 1.0.11
        working-directory: BuddhaStudyTutor
        run: gradle assembleDebug assembleDebugAndroidTest assembleRelease lintDebug --stacktrace
      - name: Package APKs and signing report
        run: |
          mkdir -p tutor-artifacts
          cp BuddhaStudyTutor/app/build/outputs/apk/debug/app-debug.apk tutor-artifacts/BuddhaStudy-Tutor-v1.0.11-TEST-ONLY.apk
          if [ -f BuddhaStudyTutor/app/build/outputs/apk/release/app-release.apk ]; then
            cp BuddhaStudyTutor/app/build/outputs/apk/release/app-release.apk tutor-artifacts/BuddhaStudy-Tutor-v1.0.11-release.apk
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs tutor-artifacts/BuddhaStudy-Tutor-v1.0.11-release.apk > tutor-artifacts/signing-report.txt
          else
            cp BuddhaStudyTutor/app/build/outputs/apk/release/app-release-unsigned.apk tutor-artifacts/BuddhaStudy-Tutor-v1.0.11-UNSIGNED.apk
            echo "NOT READY FOR UPLOAD: release signing key has not been configured. TEST-ONLY is debug signed. UNSIGNED must be signed with the owner's permanent release key." > tutor-artifacts/signing-report.txt
          fi
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: BuddhaStudy-Tutor-v1.0.11-APKs
          path: tutor-artifacts/
          retention-days: 30
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Launch app and capture actual screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash BuddhaStudyTutor/ci/capture-screenshots.sh
      - name: Upload screenshots and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BuddhaStudy-Tutor-v1.0.11-Screenshots
          path: |
            store-screenshots/
            screenshot-test.txt
            BuddhaStudyTutor/app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 30
