name: Build Buddhas Screen Recorder APK

on:
  push:
    branches: [ screen-recorder-v1 ]
    paths:
      - 'BuddhasScreenRecorder/**'
      - '.github/workflows/build-screen-recorder.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-screen-recorder:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BuddhasScreenRecorder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build recorder APK
        run: gradle assembleDebug --stacktrace
      - name: Rename recorder APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "Buddhas Screen Recorder v1.3.0.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Buddhas-Screen-Recorder-APK-v1.3.0
          path: 'BuddhasScreenRecorder/Buddhas Screen Recorder v1.3.0.apk'
          if-no-files-found: error
