name: Build Buddhas Ride APK

on:
  workflow_dispatch:
  push:
    branches: [ buddhas-ride-app ]
    paths:
      - 'BuddhasRideAndroid/**'
      - '.github/workflows/build-buddhas-ride.yml'

permissions:
  contents: read

jobs:
  build-buddhas-ride:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BuddhasRideAndroid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Rebuild exact Buddhas Ride logo
        run: gradle prepareBrandLogo --stacktrace
      - name: Verify Buddhas Ride v1.0.5 PWA display fix
        run: |
          grep -q "applicationId 'com.buddhaspinas.buddhasride'" app/build.gradle
          grep -q "versionName '1.0.5'" app/build.gradle
          grep -q "versionCode 6" app/build.gradle
          grep -q "id 'com.google.gms.google-services'" app/build.gradle
          grep -q 'com.buddhaspinas.buddhasride' app/google-services.json
          grep -q 'StableMainActivity' app/src/main/AndroidManifest.xml
          grep -q 'BuddhasRideAndroid/1.0.5' app/src/main/java/com/buddhaspinas/buddhasride/StableMainActivity.java
          grep -q 'setTextZoom(100)' app/src/main/java/com/buddhaspinas/buddhasride/StableMainActivity.java
          grep -q 'setInitialScale(100)' app/src/main/java/com/buddhaspinas/buddhasride/StableMainActivity.java
          grep -q 'applySafeAreaInsets' app/src/main/java/com/buddhaspinas/buddhasride/StableMainActivity.java
          grep -q 'WindowInsets.Type.statusBars' app/src/main/java/com/buddhaspinas/buddhasride/StableMainActivity.java
          grep -q 'text-size-adjust' app/src/main/java/com/buddhaspinas/buddhasride/StableMainActivity.java
          grep -q 'FirebaseMessagingService' app/src/main/java/com/buddhaspinas/buddhasride/BuddhasRideFirebaseMessagingService.java
          grep -q 'StableMainActivity.class' app/src/main/java/com/buddhaspinas/buddhasride/BuddhasRideFirebaseMessagingService.java
          ! grep -q 'Opening Buddhas Ride in your browser' app/src/main/java/com/buddhaspinas/buddhasride/StableMainActivity.java
          ! grep -R -n 'com.onesignal' app/src app/build.gradle
          ! grep -R -n 'RECORD_AUDIO' app/src/main
          test -s app/src/main/res/drawable-nodpi/buddhas_ride_logo.png
          python3 - <<'PY'
          from pathlib import Path
          import struct
          p=Path('app/src/main/res/drawable-nodpi/buddhas_ride_logo.png')
          b=p.read_bytes()
          assert b[:8] == b'\x89PNG\r\n\x1a\n'
          assert b[12:16] == b'IHDR'
          w,h = struct.unpack('>II', b[16:24])
          assert (w,h) == (320,320), (w,h)
          print('Verified exact Buddhas Ride logo:', w, 'x', h, len(b), 'bytes')
          PY
      - name: Build installable debug APK
        run: gradle assembleDebug --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "Buddhas Ride v1.0.5 PWA Display Fixed.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Buddhas-Ride-v1.0.5-PWA-Display-Fixed-APK
          path: "BuddhasRideAndroid/Buddhas Ride v1.0.5 PWA Display Fixed.apk"
          if-no-files-found: error
