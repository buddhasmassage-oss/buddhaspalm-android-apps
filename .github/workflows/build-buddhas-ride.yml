name: Build Buddhas Ride APK

on:
  workflow_dispatch:
  push:
    branches: [ buddhas-ride-app ]
    paths:
      - 'BuddhasRideAndroid/**'
      - '.github/workflows/build-buddhas-ride.yml'

permissions:
  contents: read

jobs:
  build-buddhas-ride:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BuddhasRideAndroid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify Buddhas Ride v1.0.4 in-app build
        run: |
          grep -q "applicationId 'com.buddhaspinas.buddhasride'" app/build.gradle
          grep -q "versionName '1.0.4'" app/build.gradle
          grep -q "id 'com.google.gms.google-services'" app/build.gradle
          grep -q 'com.buddhaspinas.buddhasride' app/google-services.json
          grep -q 'StableMainActivity' app/src/main/AndroidManifest.xml
          grep -q 'BuddhasRideAndroid/1.0.4' app/src/main/java/com/buddhaspinas/buddhasride/StableMainActivity.java
          grep -q 'FirebaseMessagingService' app/src/main/java/com/buddhaspinas/buddhasride/BuddhasRideFirebaseMessagingService.java
          grep -q 'StableMainActivity.class' app/src/main/java/com/buddhaspinas/buddhasride/BuddhasRideFirebaseMessagingService.java
          ! grep -q 'Opening Buddhas Ride in your browser' app/src/main/java/com/buddhaspinas/buddhasride/StableMainActivity.java
          ! grep -R -n 'com.onesignal' app/src app/build.gradle
          ! grep -R -n 'RECORD_AUDIO' app/src/main
          test -f app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -f app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          test -f app/src/main/res/drawable-nodpi/buddhas_ride_logo.png
      - name: Build installable debug APK
        run: gradle assembleDebug --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "Buddhas Ride v1.0.4 In-App Fixed.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Buddhas-Ride-v1.0.4-In-App-Fixed-APK
          path: "BuddhasRideAndroid/Buddhas Ride v1.0.4 In-App Fixed.apk"
          if-no-files-found: error
