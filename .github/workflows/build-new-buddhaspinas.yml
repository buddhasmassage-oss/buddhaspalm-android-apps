name: Build New BuddhasPinas APK

on:
  workflow_dispatch:
  push:
    branches:
      - new-buddhaspinas-school-app

permissions:
  contents: read

jobs:
  build-new-buddhaspinas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NewBuddhasPinas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build New BuddhasPinas APK
        run: gradle assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "New BuddhasPinas.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: New-BuddhasPinas-APK
          path: "NewBuddhasPinas/New BuddhasPinas.apk"
          if-no-files-found: error
      - name: Package Android source code
        run: |
          zip -r ../New-BuddhasPinas-Android-Source-v1.0.1.zip . \
            -x "app/build/*" ".gradle/*" "build/*" "*.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: New-BuddhasPinas-Android-Source-v1.0.1
          path: New-BuddhasPinas-Android-Source-v1.0.1.zip
          if-no-files-found: error
