name: Build New BuddhasPinas School APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'NewBuddhasPinas/**'
      - '.github/workflows/build-new-buddhaspinas.yml'

permissions:
  contents: read

jobs:
  build-school-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NewBuddhasPinas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify school-only package and website
        run: |
          grep -q "applicationId 'net.buddhaspalm.school'" app/build.gradle
          grep -q 'https://school.buddhaspinas.com/' app/src/main/java/net/buddhaspalm/school/MainActivity.java
          grep -q 'school.buddhaspinas.com' app/src/main/java/net/buddhaspalm/school/SchoolFirebaseConfigManager.java
          ! grep -R -n -E 'tutor\.buddhaspalm\.net|net\.buddhaspalm\.tutor' app/src app/google-services.json
      - name: Build installable debug APK
        run: gradle assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "New BuddhasPinas School v1.0.5.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: New-BuddhasPinas-School-v1.0.5-APK
          path: "NewBuddhasPinas/New BuddhasPinas School v1.0.5.apk"
          if-no-files-found: error
