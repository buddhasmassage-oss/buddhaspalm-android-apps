name: Build New BuddhasPinas APK

on:
  workflow_dispatch:
  push:
    branches:
      - new-buddhaspinas-school-app

permissions:
  contents: read

jobs:
  build-new-buddhaspinas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NewBuddhasPinas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install exact uploaded Buddhas Training launcher logo
        run: |
          set -e
          EXPECTED="d0e7af83587427444d41adf129b840e5d4a7ad64887194abe9f1e72b23bab2d9"
          cat icon_payload/buddhas_training_128_part1.b64 icon_payload/buddhas_training_128_part2.b64 | base64 -d > /tmp/buddhas_training_icon.png
          test "$(sha256sum /tmp/buddhas_training_icon.png | awk '{print $1}')" = "$EXPECTED"

          rm -f app/src/main/res/drawable/app_icon.jpg
          cp /tmp/buddhas_training_icon.png app/src/main/res/drawable/app_icon.png

          for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p "app/src/main/res/$d"
            rm -f "app/src/main/res/$d/ic_launcher.jpg" "app/src/main/res/$d/ic_launcher_round.jpg"
            cp /tmp/buddhas_training_icon.png "app/src/main/res/$d/ic_launcher.png"
            cp /tmp/buddhas_training_icon.png "app/src/main/res/$d/ic_launcher_round.png"
            test "$(sha256sum app/src/main/res/$d/ic_launcher.png | awk '{print $1}')" = "$EXPECTED"
            test "$(sha256sum app/src/main/res/$d/ic_launcher_round.png | awk '{print $1}')" = "$EXPECTED"
          done

          test "$(sha256sum app/src/main/res/drawable/app_icon.png | awk '{print $1}')" = "$EXPECTED"

      - name: Build New BuddhasPinas APK
        run: gradle clean assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "New BuddhasPinas v1.0.4 Buddhas Training Logo.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: New-BuddhasPinas-APK-v1.0.4-Buddhas-Training-Logo
          path: "NewBuddhasPinas/New BuddhasPinas v1.0.4 Buddhas Training Logo.apk"
          if-no-files-found: error

      - name: Package Android source code
        run: |
          zip -r ../New-BuddhasPinas-Android-Source-v1.0.4.zip . \
            -x "app/build/*" ".gradle/*" "build/*" "*.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: New-BuddhasPinas-Android-Source-v1.0.4
          path: New-BuddhasPinas-Android-Source-v1.0.4.zip
          if-no-files-found: error
