name: Build Buddhas Staff Admin APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'BuddhasStaffAdmin-source-v1.0.0.zip'
      - '.github/workflows/build-buddhas-staff-admin.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract standalone Staff Admin source
        run: unzip -q BuddhasStaffAdmin-source-v1.0.0.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable debug APK
        working-directory: BuddhasStaffAdmin
        run: gradle --no-daemon clean assembleDebug

      - name: Prepare APK
        run: |
          cp BuddhasStaffAdmin/app/build/outputs/apk/debug/app-debug.apk Buddhas-Staff-Admin-v1.0.0.apk
          sha256sum Buddhas-Staff-Admin-v1.0.0.apk > Buddhas-Staff-Admin-v1.0.0.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Buddhas-Staff-Admin-v1.0.0
          path: |
            Buddhas-Staff-Admin-v1.0.0.apk
            Buddhas-Staff-Admin-v1.0.0.apk.sha256
          if-no-files-found: error
          retention-days: 30
