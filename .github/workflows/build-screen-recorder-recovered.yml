name: Build Recovered Buddhas Screen Recorder APK
on:
  workflow_dispatch:
  push:
    branches: [ screen-recorder-buddha-logo ]
    paths:
      - 'BuddhasScreenRecorderRecovered/**'
      - '.github/workflows/build-screen-recorder-recovered.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: BuddhasScreenRecorderRecovered
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Buddhas-Screen-Recorder-Buddha-Logo-APK
          path: BuddhasScreenRecorderRecovered/app/build/outputs/apk/debug/app-debug.apk
