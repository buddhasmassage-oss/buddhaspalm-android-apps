name: Build Buddhas Training APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'BuddhasTraining/**'
      - '.github/workflows/build-buddhas-training.yml'

permissions:
  contents: read

jobs:
  build-buddhas-training:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BuddhasTraining
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build Buddhas Training APK
        run: gradle assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "Buddhas Training.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Buddhas-Training-APK
          path: "BuddhasTraining/Buddhas Training.apk"
