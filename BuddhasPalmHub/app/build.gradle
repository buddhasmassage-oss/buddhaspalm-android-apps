plugins {
    id 'com.android.application'
}

android {
    namespace 'com.buddhaspalm.hub'
    compileSdk 35

    defaultConfig {
        applicationId 'com.buddhaspalm.hub'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'com.onesignal:OneSignal:5.9.2'
}
