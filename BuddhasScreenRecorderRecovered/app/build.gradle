plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'net.buddhaspinas.screenrecorder'
    compileSdk 35

    defaultConfig {
        applicationId 'net.buddhaspinas.screenrecorder'
        minSdk 26
        targetSdk 35
        versionCode 150
        versionName '1.5.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
