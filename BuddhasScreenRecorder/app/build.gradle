plugins {
    id 'com.android.application'
}

android {
    namespace 'net.buddhaspinas.screenrecorder'
    compileSdk 35

    defaultConfig {
        applicationId 'net.buddhaspinas.screenrecorder'
        minSdk 26
        targetSdk 35
        versionCode 17
        versionName '1.4.3'
    }

    buildTypes {
        release { minifyEnabled false }
    }
}

// Clean Buddha artwork is stored as small text-safe WebP Base64 parts.
// Reassemble before Android resource processing so launchers and the floating overlay
// use the exact user-supplied artwork without malformed PNG metadata.
def iconParts = [
        file('icon-assets/app_logo.webp.b64.part1'),
        file('icon-assets/app_logo.webp.b64.part2'),
        file('icon-assets/app_logo.webp.b64.part3'),
        file('icon-assets/app_logo.webp.b64.part4')
]
def buddhasLogoOutput = file('src/main/res/drawable/app_logo.webp')

tasks.register('prepareBuddhasAppLogo') {
    inputs.files(iconParts)
    outputs.file(buddhasLogoOutput)
    doLast {
        buddhasLogoOutput.parentFile.mkdirs()
        String encoded = iconParts.collect { it.getText('UTF-8').trim() }.join('')
                .replaceAll('[^A-Za-z0-9+/=]', '')
        byte[] data = encoded.decodeBase64()
        if (data.length < 16 ||
                data[0] != (byte)'R' || data[1] != (byte)'I' || data[2] != (byte)'F' || data[3] != (byte)'F' ||
                data[8] != (byte)'W' || data[9] != (byte)'E' || data[10] != (byte)'B' || data[11] != (byte)'P') {
            throw new GradleException('Decoded Buddha logo is not a valid WebP image')
        }
        buddhasLogoOutput.bytes = data
    }
}

tasks.named('preBuild').configure { dependsOn('prepareBuddhasAppLogo') }
