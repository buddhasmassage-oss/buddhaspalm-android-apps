plugins {
    id 'com.android.application'
}

android {
    namespace 'net.buddhaspinas.screenrecorder'
    compileSdk 35

    defaultConfig {
        applicationId 'net.buddhaspinas.screenrecorder'
        minSdk 26
        targetSdk 35
        versionCode 17
        versionName '1.4.3'
    }

    buildTypes {
        release { minifyEnabled false }
    }
}

// Exact Buddha PNG supplied for the APK icon. The repository stores it as Base64 text
// so GitHub connector writes remain text-safe; this task recreates the original PNG
// before Android resource processing.
def buddhasLogoBase64 = file('icon-assets/app_logo.png.b64')
def buddhasLogoOutput = file('src/main/res/drawable/app_logo.png')

tasks.register('prepareBuddhasAppLogo') {
    inputs.file(buddhasLogoBase64)
    outputs.file(buddhasLogoOutput)
    doLast {
        buddhasLogoOutput.parentFile.mkdirs()
        String clean = buddhasLogoBase64.getText('UTF-8').replaceAll('[^A-Za-z0-9+/=]', '')
        byte[] data = clean.decodeBase64()
        if (data.length < 8 ||
                (data[0] & 0xff) != 0x89 || data[1] != 0x50 || data[2] != 0x4e || data[3] != 0x47 ||
                data[4] != 0x0d || data[5] != 0x0a || data[6] != 0x1a || data[7] != 0x0a) {
            throw new GradleException('Decoded Buddha logo is not a valid PNG')
        }
        buddhasLogoOutput.bytes = data
    }
}

tasks.named('preBuild').configure { dependsOn('prepareBuddhasAppLogo') }
